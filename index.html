</div>

<span style="font-size: 24px; font-weight: 500; color: {{k.color}}">{{k.value}}</span>
<span style="font-size: 12px; color: var(--muted)">{{k.hint}}</span>
</div>
</sc-for>
</div>

<p style="margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.5">Diese Artikel liegen im Lager, sind aber nicht bei eBay eingestellt. Geschätztes Potenzial: <strong class="num">{{ePotentialTxt}}</strong> mehr Umsatz pro Monat. Zusätzlich sind {{eBeendetCount}} Angebote beendet, weil der Artikel ausverkauft war, Billbee stellt sie bei Nachschub nicht automatisch wieder ein.</p>

<span style="font-size: 13px; color: var(--ink-2)">{{m.text}}</span>
</div>
<button type="button" style="flex: 1 1 160px; min-height: 44px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 10px; background: var(--surface); color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer">Bei eBay einstellen</button>
</div>
</sc-for>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{goArtEbayFehlt}}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent-bg); color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Alle {{eFehltCount}} anzeigen und auswählen</button>

</section>

<div style="background: var(--accent-tint); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--accent-strong); line-height: 1.5">

</div>
